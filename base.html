<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Management</title><style>body{font-family:system-ui;background:#101827;color:#edf3fc;padding:25px}main{max-width:1400px;margin:auto}section{background:#1b2940;padding:20px;margin:20px 0;border-radius:10px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #456}a{color:#9cf}.button,button{display:inline-block;background:#9cf;color:#123;padding:10px;border:0;border-radius:6px;margin:4px;text-decoration:none;cursor:pointer}input,select{padding:10px;max-width:100%;box-sizing:border-box}label{display:block;margin:16px 0}label input,label select{display:block;width:100%;margin-top:6px}.form{max-width:650px}.error{background:#702f3d;padding:12px}.success{background:#16543b;padding:12px}</style></head><body><main><h1>College Management</h1><nav><a class="button" href="{{ url_for('home') }}">Show All Records</a>{% for name in ['Students','Courses','Enrollments'] %}<a class="button" href="{{ url_for('home',table=name) }}">Show All {{ name }}</a>{% endfor %}</nav>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="{{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
