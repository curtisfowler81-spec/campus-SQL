{% extends 'base.html' %}{% block content %}<section class="form"><h2>Edit {{ table }} — {{ row[spec.pk] }}</h2><p>Primary IDs are fixed. Optional blanks save as NULL.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for name,kind,limit,required in spec.fields %}<label>{{ name }}{% if required %} (required){% endif %}{% if kind == 'student' %}<select name="{{ name }}" required>{% for item in students %}<option value="{{ item.student_id }}" {% if item.student_id == row[name] %}selected{% endif %}>{{ item.student_id }} — {{ item.first_name or '' }} {{ item.last_name or '' }}</option>{% endfor %}</select>{% elif kind == 'course' %}<select name="{{ name }}" required>{% for item in courses %}<option value="{{ item.course_id }}" {% if item.course_id == row[name] %}selected{% endif %}>{{ item.course_id }} — {{ item.course_name or '' }}</option>{% endfor %}</select>{% else %}<input type="{{ kind }}" name="{{ name }}" value="{{ row[name] if row[name] is not none else '' }}" {% if required %}required{% endif %} {% if limit %}maxlength="{{ limit }}"{% endif %} {% if kind == 'number' %}min="0" max="2147483647" step="1"{% endif %} {% if kind == 'datetime-local' %}step="1"{% endif %}>{% endif %}</label>{% endfor %}<button type="submit">Save to MySQL</button> <a href="{{ url_for('home') }}">Cancel</a></form></section>{% endblock %}
